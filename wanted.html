<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8"/>

  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#019863",
            secondary: "#4D96A9",
            "background-light": "#f0f4f8",
            "background-dark": "#0f172a",
            "card-dark": "#1e293b"
          },
          fontFamily: { display: "Spline Sans" }
        }
      }
    };
    if (localStorage.getItem('zzz_theme') === 'dark' || (!('zzz_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24 }
    .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .dark .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .mesh-bg {
        background-color: #f0f4f8;
        background-image: radial-gradient(at 40% 20%, hsla(160,100%,74%,1) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(189,100%,56%,1) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%);
    }
    .dark .mesh-bg {
        background-color: #0f172a;
        background-image: radial-gradient(at 40% 20%, hsla(160,50%,20%,1) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(189,50%,20%,1) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(355,20%,10%,1) 0px, transparent 50%);
    }
    .step-fade { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    /* === GEN Z WANTED PAGE: TINDER-STYLE === */
    .swipe-deck {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      height: 480px;
    }

    .swipe-card {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      cursor: grab;
      user-select: none;
      transition: transform 0.12s ease, box-shadow 0.3s;
      transform-origin: bottom center;
      will-change: transform;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .swipe-card:active { cursor: grabbing; }

    /* Stack depth illusion */
    .swipe-card:nth-child(2) { transform: scale(0.95) translateY(16px); z-index: 1; }
    .swipe-card:nth-child(3) { transform: scale(0.90) translateY(30px); z-index: 0; }
    .swipe-card:nth-child(1) { z-index: 2; }

    /* Swipe overlays */
    .swipe-yes-overlay, .swipe-no-overlay {
      position: absolute;
      top: 20px;
      padding: 8px 20px;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      border: 4px solid;
      transition: opacity 0.1s;
    }
    .swipe-yes-overlay { left: 20px; color: #019863; border-color: #019863; transform: rotate(-15deg); }
    .swipe-no-overlay { right: 20px; color: #ef4444; border-color: #ef4444; transform: rotate(15deg); }

    /* Gradient card backgrounds */
    .wcard-bg-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .wcard-bg-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .wcard-bg-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .wcard-bg-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .wcard-bg-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
    .wcard-bg-6 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }

    /* Card action buttons */
    .swipe-action-btns {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 24px;
    }
    .swipe-action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: white;
    }
    html.dark .swipe-action-btn { background: #1e293b; }
    .swipe-action-btn:hover { transform: scale(1.15); }
    .swipe-action-btn.skip { box-shadow: 0 8px 24px rgba(239,68,68,0.3); }
    .swipe-action-btn.offer { box-shadow: 0 8px 24px rgba(1,152,99,0.4); }
  </style>
  <script src="js/schema.js"></script>
  <script src="js/utils.js"></script>

  @keyframes bounce-gentle {

<body class="font-display min-h-screen flex flex-col text-gray-800 dark:text-gray-100 mesh-bg transition-colors duration-500">

  <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 py-12 w-full flex flex-col items-center">
    
    <div class="text-center mb-10">
      <h1 class="text-4xl md:text-5xl font-black mb-4 bg-gradient-to-r from-blue-600 to-primary bg-clip-text text-transparent">What are you looking for?</h1>
      <p class="text-lg text-gray-600 dark:text-gray-300 font-medium">Post a detailed request and let sellers come to you.</p>
    </div>

    <!-- Gen Z: Swipe Mode Toggle -->
    <div class="flex items-center justify-between mb-6 w-full">
      <div class="flex items-center gap-2">
        <span class="text-2xl">👀</span>
        <h2 class="text-xl font-black text-gray-900 dark:text-white">Buyer Demand</h2>
        <span class="text-xs font-bold text-purple-600 bg-purple-100 dark:bg-purple-900/30 dark:text-purple-400 px-2 py-0.5 rounded-full animate-pulse">LIVE</span>
      </div>
      <div class="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl gap-1">
        <button onclick="setViewMode('swipe')" id="swipeViewBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white dark:bg-gray-700 shadow text-gray-700 dark:text-gray-200">🔄 Swipe</button>
        <button onclick="setViewMode('grid')" id="gridViewBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-500 dark:text-gray-400">📊 Grid</button>
      </div>
    </div>

    <!-- Swipe Deck -->
    <div id="swipeDeckContainer" class="hidden w-full mb-10">
      <div class="swipe-deck" id="swipeDeck"></div>
      <div class="swipe-action-btns">
        <button class="swipe-action-btn skip" onclick="swipeCard('skip')" title="Not interested">❌</button>
        <button class="swipe-action-btn" onclick="swipeCard('save')" title="Save for later">❤️</button>
        <button class="swipe-action-btn offer" onclick="swipeCard('offer')" title="I can supply this!">⚡</button>
      </div>
      <p class="text-center text-xs text-gray-500 mt-4">← Skip &nbsp;&nbsp; Save ❤ &nbsp;&nbsp; I Can Supply →</p>
    </div>

    <!-- MAIN FORM CONTAINER -->
    <div id="wantedGrid" class="glass-panel w-full rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden">
        
        <!-- STEP 1: CATEGORY -->
        <div id="step1" class="step-fade">
            <h3 class="text-xl font-bold mb-6 flex items-center gap-2"><span class="material-symbols-outlined text-primary">category</span> Select Category</h3>
            <div id="categoryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </div>

        <!-- STEP 2: DETAILS -->
        <div id="step2" class="step-fade hidden space-y-8">
            <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-4">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary" id="selectedCatIcon">category</span>
                    <span id="selectedCatName">Category</span>
                </h3>
                <button onclick="goBack()" class="text-sm font-bold text-blue-600 hover:underline flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span> Change
                </button>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-sm font-bold mb-2">Request Title *</label>
                <input type="text" id="reqTitle" class="w-full bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary focus:bg-white dark:focus:bg-gray-800 transition-all" placeholder="e.g. Looking for a used iPhone 13 Pro">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Subcategory -->
                <div>
                    <label class="block text-sm font-bold mb-2">Subcategory *</label>
                    <select id="reqSubcat" class="w-full bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary focus:bg-white dark:focus:bg-gray-800 transition-all" required></select>
                </div>
                <!-- Location -->
                <div>
                    <label class="block text-sm font-bold mb-2">State *</label>
                    <select id="reqState" class="w-full bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary focus:bg-white dark:focus:bg-gray-800 transition-all" required></select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">City *</label>
                    <select id="reqCity" class="w-full bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary focus:bg-white dark:focus:bg-gray-800 transition-all" disabled required></select>
                </div>
            </div>

            <!-- Dynamic Fields Container -->
            <div id="dynamicFieldsArea" class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-white/30 dark:bg-black/10 p-6 rounded-2xl border border-gray-200 dark:border-gray-700 hidden">
            </div>

            <!-- Budget -->
            <div class="bg-primary/5 dark:bg-primary/10 p-6 rounded-2xl border border-primary/20">
                <h4 class="font-bold mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-primary">payments</span> Budget Range</h4>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Min (₹)</label>
                        <input type="number" id="reqMin" class="w-full bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary" value="0">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Max (₹)</label>
                        <input type="number" id="reqMax" class="w-full bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary" placeholder="Optional">
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-bold mb-2">Detailed Description</label>
                <textarea id="reqDesc" rows="4" class="w-full bg-white/50 dark:bg-black/20 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary focus:bg-white dark:focus:bg-gray-800 transition-all" placeholder="Describe any specific requirements, condition preferences, or deal-breakers..."></textarea>
            </div>

            <!-- Submit -->
            <button onclick="submitRequest()" id="submitBtn" class="w-full bg-gradient-to-r from-primary to-emerald-500 text-white font-black py-4 rounded-xl shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all flex items-center justify-center gap-2 text-lg">
                <span class="material-symbols-outlined">send</span> Post Wanted Ad
            </button>
        </div>
    </div>
  </main>

  <script>
    let currentUser = null;
    let schema = {};
    let globalBrain = null;
    let currentCategoryKey = null;
    let currentCategory = null;

    document.addEventListener("DOMContentLoaded", async () => {
      currentUser = getCurrentUser();
      if (currentUser) {
          fetch('/api/auth.php?action=me', { credentials: 'include' }).then(r => r.json()).then(d => {
              if (d.success && d.data) {
                  localStorage.setItem('zzz_user', JSON.stringify(d.data));
              } else if (!d.success) {
                  localStorage.removeItem('zzz_user');
                  window.location.href = 'Login Page.html?redirect=wanted.html';
              }
          }).catch(()=>{});
      }
      if (!currentUser) {
          window.location.href = 'Login Page.html?redirect=wanted.html';
          return;
      }

      // Load Schema
      try {
          const res = await fetch('/api/schema.php').then(r => r.json());
          let brain = (res.success && res.data && res.data.source !== 'default') ? res.data : ZZZ_SCHEMA;
          globalBrain = brain;
          
          if(brain.categories) {
              brain.categories.forEach(cat => {
                  let mySubs = (brain.subcategories||[]).filter(s => s.categoryId === cat.id);
                  schema[cat.id] = {
                      label: cat.label,
                      icon: cat.icon,
                      color: cat.color || 'text-primary',
                      subs: mySubs.map(s => s.label)
                  };
              });
              renderCategoryGrid();
          }
      } catch(e) {
          console.error(e);
      }

      // Populate States
      const INDIA_STATES = {
        "Andhra Pradesh": ["Visakhapatnam", "Vijayawada", "Guntur", "Nellore", "Tirupati", "Kurnool", "Rajahmundry"],
        "Arunachal Pradesh": ["Itanagar", "Naharlagun", "Pasighat"],
        "Assam": ["Guwahati", "Silchar", "Dibrugarh", "Jorhat", "Nagaon"],
        "Bihar": ["Patna", "Gaya", "Bhagalpur", "Muzaffarpur", "Darbhanga"],
        "Chhattisgarh": ["Raipur", "Bhilai", "Bilaspur", "Korba", "Durg"],
        "Delhi": ["New Delhi", "North Delhi", "South Delhi", "East Delhi", "West Delhi", "Central Delhi"],
        "Goa": ["Panaji", "Margao", "Vasco da Gama", "Mapusa", "Ponda"],
        "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot", "Bhavnagar", "Jamnagar", "Gandhinagar"],
        "Haryana": ["Gurugram", "Faridabad", "Panipat", "Ambala", "Hisar", "Rohtak"],
        "Himachal Pradesh": ["Shimla", "Manali", "Dharamsala", "Solan", "Mandi"],
        "Jharkhand": ["Ranchi", "Jamshedpur", "Dhanbad", "Bokaro", "Deoghar"],
        "Karnataka": ["Bengaluru", "Mysuru", "Mangaluru", "Hubballi", "Belagavi", "Kalaburagi", "Davangere"],
        "Kerala": ["Thiruvananthapuram", "Kochi", "Kozhikode", "Thrissur", "Kollam", "Alappuzha"],
        "Madhya Pradesh": ["Bhopal", "Indore", "Jabalpur", "Gwalior", "Ujjain", "Sagar"],
        "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Nashik", "Aurangabad", "Thane", "Navi Mumbai", "Solapur"],
        "Manipur": ["Imphal", "Thoubal", "Bishnupur"],
        "Meghalaya": ["Shillong", "Tura", "Jowai"],
        "Mizoram": ["Aizawl", "Lunglei", "Champhai"],
        "Nagaland": ["Kohima", "Dimapur", "Mokokchung"],
        "Odisha": ["Bhubaneswar", "Cuttack", "Rourkela", "Berhampur", "Sambalpur"],
        "Punjab": ["Ludhiana", "Amritsar", "Jalandhar", "Patiala", "Bathinda", "Mohali"],
        "Rajasthan": ["Jaipur", "Jodhpur", "Udaipur", "Kota", "Ajmer", "Bikaner", "Alwar"],
        "Sikkim": ["Gangtok", "Namchi", "Mangan"],
        "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli", "Salem", "Erode", "Tiruppur", "Vellore"],
        "Telangana": ["Hyderabad", "Warangal", "Nizamabad", "Karimnagar", "Khammam", "Secunderabad"],
        "Tripura": ["Agartala", "Dharmanagar", "Udaipur"],
        "Uttar Pradesh": ["Lucknow", "Kanpur", "Ghaziabad", "Agra", "Varanasi", "Meerut", "Allahabad", "Noida", "Bareilly"],
        "Uttarakhand": ["Dehradun", "Haridwar", "Roorkee", "Haldwani", "Rishikesh"],
        "West Bengal": ["Kolkata", "Howrah", "Durgapur", "Asansol", "Siliguri", "Malda"],
        "Andaman & Nicobar": ["Port Blair"],
        "Chandigarh": ["Chandigarh"],
        "Jammu & Kashmir": ["Srinagar", "Jammu", "Anantnag", "Baramulla"],
        "Ladakh": ["Leh", "Kargil"],
        "Lakshadweep": ["Kavaratti"],
        "Puducherry": ["Puducherry", "Karaikal", "Mahe"]
      };

      const stateSelect = document.getElementById('reqState');
      stateSelect.innerHTML = '<option value="">Select State</option>';
      Object.keys(INDIA_STATES).forEach(state => {
          const opt = document.createElement('option');
          opt.value = state;
          opt.textContent = state;
          stateSelect.appendChild(opt);
      });
      stateSelect.addEventListener('change', e => {
          const s = e.target.value;
          const citySelect = document.getElementById('reqCity');
          citySelect.innerHTML = '<option value="">Select City</option>';
          if(s && INDIA_STATES[s]) {
              INDIA_STATES[s].forEach(city => {
                  const opt = document.createElement('option');
                  opt.value = city;
                  opt.textContent = city;
                  citySelect.appendChild(opt);
              });
              citySelect.disabled = false;
          } else {
              citySelect.disabled = true;
          }
      });
    });

    function renderCategoryGrid() {
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';
        Object.keys(schema).forEach(key => {
            const cat = schema[key];
            const div = document.createElement('div');
            div.className = "cursor-pointer flex flex-col items-center justify-center p-6 rounded-2xl bg-white/60 dark:bg-gray-800/60 hover:bg-white dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-md transition-all gap-3 group";
            div.innerHTML = `<span class="material-symbols-outlined text-5xl ${cat.color} group-hover:scale-110 transition-transform">${cat.icon}</span><span class="text-sm font-black text-center">${cat.label}</span>`;
            div.onclick = () => selectCategory(key);
            grid.appendChild(div);
        });
    }

    function selectCategory(key) {
        currentCategoryKey = key;
        currentCategory = schema[key];
        
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        
        document.getElementById('selectedCatIcon').textContent = currentCategory.icon;
        document.getElementById('selectedCatName').textContent = currentCategory.label;
        document.getElementById('selectedCatIcon').className = `material-symbols-outlined ${currentCategory.color}`;

        const subcatEl = document.getElementById('reqSubcat');
        subcatEl.innerHTML = '<option value="">Select Subcategory...</option>';
        currentCategory.subs.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            subcatEl.appendChild(opt);
        });

        // Trigger dynamic fields on subcategory change
        subcatEl.onchange = (e) => {
            renderDynamicFields(e.target.value);
        };
        
        // Initial clear
        document.getElementById('dynamicFieldsArea').innerHTML = '';
        document.getElementById('dynamicFieldsArea').classList.add('hidden');
    }

    function renderDynamicFields(subcategoryLabel) {
        const area = document.getElementById('dynamicFieldsArea');
        area.innerHTML = '';
        area.classList.add('hidden');
        
        if(!subcategoryLabel) return;

        let brain = globalBrain;
        if(!brain) {
           try { brain = JSON.parse(localStorage.getItem('zzz_classifieds_schema')); } catch(e){}
        }
        if(!brain) brain = ZZZ_SCHEMA;
        
        const subcatObj = (brain.subcategories||[]).find(s => s.label === subcategoryLabel && s.categoryId === currentCategoryKey);
        if(!subcatObj) return;

        const catFields = (brain.category_fields||[]).filter(cf => cf.categoryId === currentCategoryKey && (!cf.subcategoryId || cf.subcategoryId === subcatObj.id));
        
        if(catFields.length > 0) {
            area.classList.remove('hidden');
            catFields.forEach(cf => {
                const field = (brain.fields||[]).find(f => f.id === cf.fieldId);
                if(!field) return;

                const wrapper = document.createElement('div');
                let inputHtml = '';
                
                if (field.type === 'select' && field.options) {
                    const opts = field.options.map(o => `<option value="${o}">${o}</option>`).join('');
                    inputHtml = `<select id="dyn_${field.id}" class="w-full bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary" ${field.required?'required':''}>
                        <option value="">Any</option>${opts}
                    </select>`;
                } else if (field.type === 'boolean') {
                    inputHtml = `<select id="dyn_${field.id}" class="w-full bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary" ${field.required?'required':''}>
                        <option value="">Any</option><option value="Yes">Yes</option><option value="No">No</option>
                    </select>`;
                } else {
                    inputHtml = `<input type="${field.type==='number'?'number':'text'}" id="dyn_${field.id}" class="w-full bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 font-bold focus:ring-primary" placeholder="Any" ${field.required?'required':''}>`;
                }

                wrapper.innerHTML = `<label class="block text-sm font-bold mb-2">${field.label} ${field.required?'*':''}</label>${inputHtml}`;
                area.appendChild(wrapper);
            });
        }
    }

    function goBack() {
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
    }

    async function submitRequest() {
        const title = document.getElementById('reqTitle').value.trim();
        const subcat = document.getElementById('reqSubcat').value;
        const state = document.getElementById('reqState').value;
        const city = document.getElementById('reqCity').value;
        
        if(!title) { showToast('Please enter a title', 'error'); return; }
        if(!subcat) { showToast('Please select a subcategory', 'error'); return; }
        if(!state || !city) { showToast('Please select your location', 'error'); return; }

        // Gather dynamic fields
        const dynamic_data = {};
        const area = document.getElementById('dynamicFieldsArea');
        const inputs = area.querySelectorAll('input[id^="dyn_"], select[id^="dyn_"]');
        let failedRequired = false;
        inputs.forEach(input => {
            if(input.required && !input.value) failedRequired = true;
            if(input.value) {
                dynamic_data[input.id.replace('dyn_', '')] = input.value;
            }
        });

        if(failedRequired) { showToast('Please fill all required custom fields', 'error'); return; }

        const payload = {
            title,
            category: currentCategory.label,
            subcategory: subcat,
            location_state: state,
            location_city: city,
            budget_min: document.getElementById('reqMin').value,
            budget_max: document.getElementById('reqMax').value || 0,
            description: document.getElementById('reqDesc').value,
            dynamic_data
        };

        const btn = document.getElementById('submitBtn');
        const ogText = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Posting...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/wanted.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify(payload)
            }).then(r=>r.json());

            if(res.success) {
                showToast('Wanted request posted successfully!', 'success');
                setTimeout(() => window.location.href = 'classifieds.html', 1500);
            } else {
                showToast(res.error || 'Failed to post request', 'error');
                btn.innerHTML = ogText;
                btn.disabled = false;
            }
        } catch(e) {
            showToast('Network error', 'error');
            btn.innerHTML = ogText;
            btn.disabled = false;
        }
    }
  // === GEN Z: SWIPE DECK FEATURE ===
  let _swipeCards = [];
  let _currentSwipeIdx = 0;
  let _swipeMode = false;
  let _dragStart = null;
  const BG_CLASSES = ['wcard-bg-1','wcard-bg-2','wcard-bg-3','wcard-bg-4','wcard-bg-5','wcard-bg-6'];

  function setViewMode(mode) {
    _swipeMode = mode === 'swipe';
    document.getElementById('swipeDeckContainer').classList.toggle('hidden', !_swipeMode);
    document.getElementById('swipeViewBtn').classList.toggle('bg-white', _swipeMode);
    document.getElementById('swipeViewBtn').classList.toggle('shadow', _swipeMode);
    document.getElementById('gridViewBtn').classList.toggle('bg-white', !_swipeMode);
    document.getElementById('gridViewBtn').classList.toggle('shadow', !_swipeMode);
    document.getElementById('wantedGrid').classList.toggle('hidden', _swipeMode);
    if (_swipeMode && _swipeCards.length === 0 && window._wantedAds) {
      buildSwipeDeck(window._wantedAds);
    }
  }

  function buildSwipeDeck(ads) {
    _swipeCards = [...ads];
    renderSwipeDeck();
  }

  function renderSwipeDeck() {
    const deck = document.getElementById('swipeDeck');
    if (!deck) return;
    const toShow = _swipeCards.slice(0, 3);
    deck.innerHTML = toShow.map((ad, i) => {
      const bgCls = BG_CLASSES[(_currentSwipeIdx + i) % BG_CLASSES.length];
      return `
        <div class="swipe-card ${bgCls}" id="swipe-card-${i}" data-idx="${i}">
          <div class="swipe-yes-overlay" id="yes-overlay-${i}">✔ CAN SUPPLY!</div>
          <div class="swipe-no-overlay" id="no-overlay-${i}">✘ SKIP</div>
          <div class="h-full p-8 flex flex-col justify-between text-white relative">
            <div>
              <div class="flex items-center gap-2 mb-4">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center font-black">${(ad.buyer_name||'B').charAt(0)}</div>
                <div>
                  <div class="font-black text-sm">${ad.buyer_name || 'Anonymous Buyer'}</div>
                  <div class="text-white/70 text-xs">• Posted ${ad.created_at ? new Date(ad.created_at).toLocaleDateString('en-IN') : 'Recently'}</div>
                </div>
              </div>
              <h3 class="text-2xl font-black leading-tight mb-3">${ad.title || ''}</h3>
              <p class="text-white/80 text-sm leading-relaxed line-clamp-3">${ad.description || ''}</p>
            </div>
            <div>
              <div class="flex items-center justify-between">
                <div class="bg-white/20 backdrop-blur px-4 py-2 rounded-full">
                  <div class="text-xs font-bold text-white/70">Budget</div>
                  <div class="font-black">${ad.budget ? '₹' + Number(ad.budget).toLocaleString('en-IN') : 'Negotiable'}</div>
                </div>
                <div class="bg-white/20 backdrop-blur px-4 py-2 rounded-full text-right">
                  <div class="text-xs font-bold text-white/70">Category</div>
                  <div class="font-black text-sm">${ad.category || 'Any'}</div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');

    // Touch/drag support for top card
    const topCard = deck.querySelector('.swipe-card');
    if (topCard) initCardDrag(topCard);
  }

  function initCardDrag(card) {
    let startX = 0, currentX = 0;
    const onStart = e => { startX = (e.touches ? e.touches[0].clientX : e.clientX); card.style.transition = 'none'; };
    const onMove = e => {
      if(startX === 0) return;
      currentX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
      const rotate = currentX * 0.08;
      card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
      const yesEl = document.getElementById('yes-overlay-0');
      const noEl = document.getElementById('no-overlay-0');
      if (yesEl) yesEl.style.opacity = Math.max(0, currentX / 80);
      if (noEl) noEl.style.opacity = Math.max(0, -currentX / 80);
    };
    const onEnd = () => {
      if(startX === 0) return;
      startX = 0;
      card.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
      if (Math.abs(currentX) > 80) {
        swipeCard(currentX > 0 ? 'offer' : 'skip', card);
      } else {
        card.style.transform = '';
      }
      currentX = 0;
    };
    card.addEventListener('mousedown', onStart);
    card.addEventListener('touchstart', onStart, { passive: true });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: true });
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);
  }

  function swipeCard(action, cardEl) {
    const deck = document.getElementById('swipeDeck');
    const card = cardEl || deck?.querySelector('.swipe-card');
    if (!card || _swipeCards.length === 0) return;

    const dir = action === 'skip' ? -1 : 1;
    card.style.transition = 'transform 0.5s ease, opacity 0.4s ease';
    card.style.transform = `translateX(${dir * 120}%) rotate(${dir * 25}deg)`;
    card.style.opacity = '0';

    const swipedAd = _swipeCards.shift();
    _currentSwipeIdx++;

    if (action === 'offer' && swipedAd) {
      window.location.href = `Post Listing.html?title=${encodeURIComponent('Re: ' + (swipedAd.title || ''))}&category=${encodeURIComponent(swipedAd.category || '')}`;
      return;
    }

    setTimeout(() => renderSwipeDeck(), 400);
  }

  document.addEventListener('DOMContentLoaded', async () => {
    // Fetch real wanted ads
    try {
        const res = await fetch('/api/wanted.php').then(r => r.json());
        if (res.success && res.data && res.data.length > 0) {
            window._wantedAds = res.data;
        } else {
            // Fallback fake data if empty
            window._wantedAds = [
                { buyer_name: 'Rahul S.', title: 'Need a used iPhone 13 Pro Max', description: 'Looking for good condition, battery health > 85%', budget: 45000, category: 'Mobiles' },
                { buyer_name: 'Priya K.', title: 'Wooden Study Table', description: 'Solid wood study table with drawers. Urgent requirement.', budget: 3500, category: 'Furniture' },
                { buyer_name: 'Amit V.', title: 'Royal Enfield Classic 350', description: 'Less than 20k kms driven, well maintained.', budget: 120000, category: 'Vehicles' }
            ];
        }
    } catch(e) {
        window._wantedAds = [];
    }
    
    if (window._wantedAds && window._wantedAds.length) {
        buildSwipeDeck(window._wantedAds);
    }
  });
  </script>
</body>
