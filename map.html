<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="description" content="Interactive map view of ZipZapZoi Classifieds. Find local listings near you on the map."/>
    <title>Map View — ZipZapZoi Classifieds</title>
    
    <script>
      if (localStorage.getItem('zzz_theme') === 'dark' || (!('zzz_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
      } else {
          document.documentElement.classList.remove('dark');
      }
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet"/>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <!-- Custom Animations -->
    <link href="css/animations.css" rel="stylesheet"/>
    
    <!-- Leaflet & MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#019863",
              secondary: "#4D96A9",
              "background-light": "#f0f4f8",
              "background-dark": "#0f172a",
              "card-dark": "#1e293b"
            },
            fontFamily: { display: "Spline Sans" }
          }
        }
      };
    </script>
    
    <style>
      body { margin: 0; padding: 0; overflow: hidden; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
      
      /* Map styling */
      #map { 
        background: #e8ecf0; 
        height: 100%;
        width: 100%;
        z-index: 10;
      }
      .dark #map { background: #0f172a; }
      
      .leaflet-marker-icon { border: none !important; background: transparent !important; }
      
      /* Price pin markers */
      .map-price-pin {
        background: #019863;
        color: white;
        padding: 4px 10px;
        border-radius: 20px;
        font-weight: 800;
        font-size: 12px;
        white-space: nowrap;
        box-shadow: 0 3px 10px rgba(1,152,99,0.4);
        border: 2px solid white;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
        position: relative;
        font-family: 'Spline Sans', sans-serif;
      }
      .dark .map-price-pin { border-color: #1e293b; }
      .map-price-pin:hover { transform: scale(1.12); z-index: 1000 !important; }
      .map-price-pin.highlighted { 
        background: #ff007f; 
        transform: scale(1.2); 
        z-index: 1000 !important;
        box-shadow: 0 4px 14px rgba(255,0,127,0.5);
      }
      /* No-coord pin (grey) */
      .map-price-pin.no-coord {
        background: #6b7280;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      }
      
      /* Cluster Icon */
      .marker-cluster-custom { background-color: rgba(1,152,99,0.2); border-radius: 50%; }
      .marker-cluster-custom div {
        background-color: #019863;
        color: white;
        font-weight: 800;
        font-family: 'Spline Sans', sans-serif;
        border-radius: 50%;
        width: 32px; height: 32px;
        margin-left: 4px; margin-top: 4px;
        text-align: center; line-height: 32px;
        border: 2px solid white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        font-size: 13px;
      }
      .dark .marker-cluster-custom div { border-color: #1e293b; }
      
      /* Sidebar */
      .sidebar-container { height: calc(100vh - 120px); }
      @media (max-width: 768px) {
        .sidebar-container {
          position: fixed;
          bottom: 64px; /* above mobile nav */
          left: 0; width: 100%;
          height: 42vh;
          z-index: 40;
          border-top-left-radius: 20px;
          border-top-right-radius: 20px;
          box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
          transform: translateY(0);
          transition: transform 0.3s ease;
        }
        .sidebar-collapsed .sidebar-container {
          transform: translateY(calc(100% - 48px));
        }
      }

      /* Logo animations */
      @keyframes bounce-gentle {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes bounce-in-letter {
        0%   { opacity:0; transform:translateY(-15px) scale(0.9); }
        50%  { opacity:1; transform:translateY(3px) scale(1.05); }
        75%  { transform:translateY(-1px) scale(0.98); }
        100% { opacity:1; transform:translateY(0) scale(1); }
      }
      .animate-bounce-in   { opacity:0; display:inline-block; animation:bounce-in-letter .5s cubic-bezier(.28,.84,.42,1) forwards; }
      .animate-logo-bouncy { animation: bounce-gentle 3s infinite ease-in-out; }
      
      /* Scrollbar hide for category pills */
      .hide-scrollbar::-webkit-scrollbar { display:none; }
      .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
      
      .cat-pill {
        white-space: nowrap; padding: 4px 12px; border-radius: 20px;
        font-size: 13px; font-weight: 700; cursor: pointer;
        transition: all .2s; border: 1px solid transparent;
      }
      .cat-pill.active  { background:#019863; color:white; border-color:#019863; }
      .cat-pill:not(.active) { background:rgba(0,0,0,.05); color:#4b5563; }
      .dark .cat-pill:not(.active) { background:rgba(255,255,255,.08); color:#e2e8f0; }
      .cat-pill:not(.active):hover { background:rgba(0,0,0,.1); }
      .dark .cat-pill:not(.active):hover { background:rgba(255,255,255,.15); }
      
      /* Leaflet Popup */
      .leaflet-popup-content-wrapper { padding:0; overflow:hidden; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.15); }
      .dark .leaflet-popup-content-wrapper { background:#1e293b; color:white; }
      .leaflet-popup-content { margin:0; width:230px !important; }
      .dark .leaflet-popup-tip { background:#1e293b; }
      .custom-popup-content img { width:100%; height:130px; object-fit:cover; }
      .custom-popup-content .info { padding:12px; }
      
      /* Near Me + Draw-radius buttons */
      .map-ctrl-btn {
        position: absolute;
        right: 16px;
        z-index: 400;
        width: 44px; height: 44px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 2px 8px rgba(0,0,0,.18);
        display: flex; align-items: center; justify-content: center;
        color: #019863;
        cursor: pointer; border: none;
        transition: all .2s;
      }
      .dark .map-ctrl-btn { background: #1e293b; color: #34d399; }
      .map-ctrl-btn:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
      .map-ctrl-btn.near-me-btn { bottom: 88px; }
      .map-ctrl-btn.recenter-btn { bottom: 140px; }
      @media (max-width: 768px) {
        .map-ctrl-btn.near-me-btn  { bottom: calc(42vh + 80px); }
        .map-ctrl-btn.recenter-btn { bottom: calc(42vh + 132px); }
      }

      /* Toast notification */
      #toast {
        position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px);
        background: #1e293b; color: white; padding: 10px 20px; border-radius: 25px;
        font-size: 14px; font-weight: 600; z-index: 9999;
        box-shadow: 0 4px 20px rgba(0,0,0,.3);
        transition: transform .3s ease, opacity .3s ease;
        opacity: 0; pointer-events: none;
        white-space: nowrap;
      }
      #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
      
      /* Loading skeleton */
      @keyframes shimmer { 0%{background-position:-200px 0} 100%{background-position:calc(200px + 100%) 0} }
      .skeleton {
        background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
        background-size: 200px 100%;
        animation: shimmer 1.2s infinite;
        border-radius: 8px;
      }
      .dark .skeleton { background: linear-gradient(90deg,#374151 25%,#4b5563 50%,#374151 75%); background-size:200px 100%; animation:shimmer 1.2s infinite; }
      
      /* Sidebar toggle handle */
      .sidebar-handle-bar { width:40px; height:4px; background:#d1d5db; border-radius:2px; }
      .dark .sidebar-handle-bar { background:#4b5563; }
      
      /* Geo-badge on listing card */
      .geo-badge { font-size:10px; padding:2px 7px; border-radius:10px; font-weight:700; }
      .geo-badge.has-loc { background:#dcfce7; color:#15803d; }
      .geo-badge.no-loc  { background:#f3f4f6; color:#9ca3af; }
      .dark .geo-badge.has-loc { background:#052e16; color:#4ade80; }
      .dark .geo-badge.no-loc  { background:#374151; color:#9ca3af; }

      /* Custom scroll */
      .custom-scroll::-webkit-scrollbar { width: 4px; }
      .custom-scroll::-webkit-scrollbar-track { background: transparent; }
      .custom-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
      .dark .custom-scroll::-webkit-scrollbar-thumb { background: #374151; }
    </style>
</head>

    <script>
        // ── State ──────────────────────────────────────────────────────────────
        let map;
        let markers = {};
        let markerClusterGroup;
        let currentListings = [];
        let activeCategory = 'All';
        let sidebarOpen = true;
        let isLoadingListings = false;
        let userLat = null, userLng = null;
        
        // Tile URLs
        const TILE_LIGHT = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        const TILE_DARK  = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        let tileLayer;

        // ── Init ───────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.getElementById('themeIcon').textContent = 'light_mode';
            }
            initCategories();
            initMap();
        });

        // ── Dark Mode ──────────────────────────────────────────────────────────
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('zzz_theme', 'light');
                document.getElementById('themeIcon').textContent = 'dark_mode';
                if (tileLayer) tileLayer.setUrl(TILE_LIGHT);
            } else {
                html.classList.add('dark');
                localStorage.setItem('zzz_theme', 'dark');
                document.getElementById('themeIcon').textContent = 'light_mode';
                if (tileLayer) tileLayer.setUrl(TILE_DARK);
            }
        }

        // ── Categories ─────────────────────────────────────────────────────────
        async function initCategories() {
            try {
                const res = await fetch('/api/schema.php');
                const data = await res.json();
                const cats = [{ id: 'All', label: '🗺️ All' }];
                if (data.success && data.data && data.data.categories) {
                    data.data.categories.forEach(c => cats.push({ id: c.id, label: c.label }));
                }
                const container = document.getElementById('categoryBar');
                container.innerHTML = cats.map(c => `
                    <button onclick="setCategory('${c.id}')" id="cat-btn-${c.id}" class="cat-pill ${c.id === 'All' ? 'active' : ''}">
                        ${c.label}
                    </button>
                `).join('');
            } catch (e) {
                document.getElementById('categoryBar').innerHTML = `
                  <button onclick="setCategory('All')" id="cat-btn-All" class="cat-pill active">🗺️ All</button>
                `;
            }
        }
        
        function setCategory(catId) {
            activeCategory = catId;
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`cat-btn-${catId}`);
            if (btn) btn.classList.add('active');
            loadListingsInView();
        }
        
        function executeSearch() {
            loadListingsInView();
        }

        // ── Map Init ───────────────────────────────────────────────────────────
        function initMap() {
            const params = new URLSearchParams(window.location.search);
            const urlLat = params.get('lat');
            const urlLng = params.get('lng');
            
            // Default center: India centre (Nagpur)
            let center = [21.1458, 79.0882];
            let zoom   = 5;
            
            if (urlLat && urlLng) {
                center = [parseFloat(urlLat), parseFloat(urlLng)];
                zoom   = 13;
            }

            map = L.map('map', { zoomControl: false }).setView(center, zoom);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            const isDark = document.documentElement.classList.contains('dark');
            tileLayer = L.tileLayer(isDark ? TILE_DARK : TILE_LIGHT, {
                maxZoom: 19,
                attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Marker cluster with custom icon
            markerClusterGroup = L.markerClusterGroup({
                maxClusterRadius: 60,
                iconCreateFunction: function(cluster) {
                    return L.divIcon({
                        html: '<div><span>' + cluster.getChildCount() + '</span></div>',
                        className: 'marker-cluster marker-cluster-custom',
                        iconSize: L.point(40, 40)
                    });
                }
            });
            map.addLayer(markerClusterGroup);

            map.on('moveend', () => { if (!isLoadingListings) loadListingsInView(); });
            
            // Try to get user location on first load
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        userLat = pos.coords.latitude;
                        userLng = pos.coords.longitude;
                        if (!urlLat && !urlLng) {
                            map.setView([userLat, userLng], 12);
                            // loadListingsInView fires via moveend
                        } else {
                            loadListingsInView();
                        }
                    },
                    () => loadListingsInView(),
                    { timeout: 5000, maximumAge: 60000 }
                );
            } else {
                loadListingsInView();
            }
        }

        // ── Load Listings ──────────────────────────────────────────────────────
        function calculateRadius() {
            const bounds = map.getBounds();
            const center = map.getCenter();
            return Math.ceil(center.distanceTo(bounds.getNorthEast()) / 1000); // km
        }

        async function loadListingsInView() {
            if (isLoadingListings) return;
            isLoadingListings = true;
            
            document.getElementById('resultsCount').textContent = 'Loading...';
            showBanner('');
            
            const center = map.getCenter();
            const radius = Math.min(calculateRadius() * 1.5, 2000); // generous radius
            const q = document.getElementById('searchInput').value.trim();
            
            let url = `/api/listings.php?lat=${center.lat.toFixed(5)}&lng=${center.lng.toFixed(5)}&radius=${Math.ceil(radius)}&status=active&limit=100`;
            if (activeCategory !== 'All') url += `&category=${encodeURIComponent(activeCategory)}`;
            if (q) url += `&q=${encodeURIComponent(q)}`;

            try {
                const res  = await fetch(url);
                const data = await res.json();
                if (data.success) {
                    renderMarkersAndSidebar(data.data.listings || [], radius);
                } else {
                    showError('Could not load listings. Please try again.');
                }
            } catch (e) {
                console.error('Map listings error:', e);
                showError('Connection error. Check your internet and try again.');
            } finally {
                isLoadingListings = false;
            }
        }

        function refreshMap() { loadListingsInView(); showToast('🔄 Refreshed!'); }

        // ── Render ─────────────────────────────────────────────────────────────
        function formatPrice(price) {
            if (!price || price == 0) return 'Free';
            const n = parseFloat(price);
            if (n >= 100000) return '₹' + (n / 100000).toFixed(1) + 'L';
            if (n >= 1000)   return '₹' + (n / 1000).toFixed(1) + 'k';
            return '₹' + n.toLocaleString('en-IN');
        }

        function renderMarkersAndSidebar(listings, radius) {
            currentListings = listings;
            markerClusterGroup.clearLayers();
            markers = {};
            
            const sidebar    = document.getElementById('sidebarListings');
            const countEl    = document.getElementById('resultsCount');
            const radiusEl   = document.getElementById('radiusLabel');
            
            const withCoords = listings.filter(l => l.latitude || l.lat);
            const total      = listings.length;

            countEl.textContent = total > 0
                ? `${total} listing${total !== 1 ? 's' : ''} found`
                : 'No listings in this area';
            
            radiusEl.textContent = radius ? `~${Math.round(radius)}km` : '';

            if (total === 0) {
                sidebar.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center p-6 opacity-70 gap-4">
                        <span class="material-symbols-outlined text-6xl text-gray-400">location_searching</span>
                        <div>
                          <p class="font-black text-gray-700 dark:text-gray-300 mb-1">No listings in this area</p>
                          <p class="text-sm text-gray-500">Try zooming out, moving the map, or clearing filters</p>
                        </div>
                        <a href="Post Listing.html" class="inline-flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-full font-bold text-sm hover:bg-green-700 transition-colors">
                          <span class="material-symbols-outlined text-[16px]">add</span> Be first to post here!
                        </a>
                    </div>
                `;
                
                if (withCoords.length === 0 && total > 0) {
                    showBanner(`${total} listings found — enable location in ads to show on map`);
                }
                return;
            }

            let sidebarHTML = '';

            listings.forEach(item => {
                const lat = parseFloat(item.latitude || item.lat || 0);
                const lng = parseFloat(item.longitude || item.lng || 0);
                const hasCoords = lat !== 0 && lng !== 0;
                
                const priceText = formatPrice(item.price);
                const imgUrl    = (item.images && item.images.length > 0)
                    ? item.images[0]
                    : (item.thumbnail || 'images/placeholder-item.png');

                // Only add map marker if listing has coordinates
                if (hasCoords) {
                    const icon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="map-price-pin" id="pin-${item.id}">${priceText}</div>`,
                        iconSize: null,
                        iconAnchor: [20, 15]
                    });

                    const marker = L.marker([lat, lng], { icon });

                    const popupContent = `
                        <div class="custom-popup-content flex flex-col">
                            <img src="${escapeHtml(imgUrl)}" onerror="this.src='https://placehold.co/400x300/e5e7eb/9ca3af?text=No+Image'" alt="${escapeHtml(item.title)}">
                            <div class="info">
                                <h4 class="font-bold text-sm truncate mb-1 dark:text-white">${escapeHtml(item.title)}</h4>
                                <div class="text-primary font-black mb-1">${priceText}</div>
                                <div class="text-xs text-gray-500 flex items-center gap-1 mb-3">
                                    <span class="material-symbols-outlined text-[14px]">location_on</span>
                                    <span class="truncate">${escapeHtml(item.city || item.location_city || 'Location')}</span>
                                </div>
                                <a href="Listing Detail.html?id=${item.id}" class="block w-full text-center bg-primary text-white text-xs font-bold py-2 rounded-lg hover:bg-green-700 transition-colors">
                                  View Details →
                                </a>
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupContent, { maxWidth: 240 });

                    marker.on('click', () => {
                        const card = document.getElementById(`card-${item.id}`);
                        if (card) {
                            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            card.style.boxShadow = '0 0 0 3px #019863';
                            setTimeout(() => card.style.boxShadow = '', 1500);
                        }
                    });

                    markers[item.id] = marker;
                    markerClusterGroup.addLayer(marker);
                }

                // Sidebar card — always shown regardless of coordinates
                const distKm = item.distance != null ? parseFloat(item.distance).toFixed(1) : null;
                sidebarHTML += `
                    <div id="card-${item.id}"
                         class="flex gap-3 bg-white dark:bg-gray-800 p-2 rounded-xl border border-gray-100 dark:border-gray-700 hover:shadow-md transition-all cursor-pointer group"
                         onmouseenter="highlightMarker(${item.id})"
                         onmouseleave="unhighlightMarker(${item.id})"
                         onclick="focusMarker(${item.id}, ${lat}, ${lng})">
                        <div class="w-20 h-20 shrink-0 rounded-lg overflow-hidden bg-gray-100 dark:bg-gray-900 relative">
                            <img src="${escapeHtml(imgUrl)}" onerror="this.src='https://placehold.co/400x300/e5e7eb/9ca3af?text=No+Image'" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                            <div>
                                <h4 class="font-bold text-sm text-gray-900 dark:text-white truncate leading-tight" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</h4>
                                <p class="text-primary font-black text-sm mt-0.5">${priceText}</p>
                            </div>
                            <div class="flex items-center justify-between mt-1">
                                <div class="flex flex-col gap-0.5">
                                  <span class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-0.5 max-w-[110px]">
                                      <span class="material-symbols-outlined text-[13px]">location_on</span>
                                      <span class="truncate">${escapeHtml(item.city || item.location_city || '—')}</span>
                                  </span>
                                  ${distKm ? `<span class="text-[10px] text-primary font-bold">📍 ${distKm} km away</span>` : ''}
                                </div>
                                <a href="Listing Detail.html?id=${item.id}" onclick="event.stopPropagation()"
                                   class="text-xs bg-primary/10 hover:bg-primary hover:text-white text-primary px-2.5 py-1 rounded-full font-bold transition-colors shrink-0">
                                  View
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });

            sidebar.innerHTML = sidebarHTML;

            // Info if some listings have no map pin
            const noCoordCount = listings.length - withCoords.length;
            if (noCoordCount > 0 && withCoords.length > 0) {
                showBanner(`${noCoordCount} listing${noCoordCount > 1 ? 's' : ''} without map pin shown in sidebar only`);
            }
        }

        // ── Marker Interactions ────────────────────────────────────────────────
        function highlightMarker(id) {
            const el = document.getElementById(`pin-${id}`);
            if (el) el.classList.add('highlighted');
        }
        function unhighlightMarker(id) {
            const el = document.getElementById(`pin-${id}`);
            if (el) el.classList.remove('highlighted');
        }
        function focusMarker(id, lat, lng) {
            if (markers[id]) {
                markerClusterGroup.zoomToShowLayer(markers[id], () => {
                    markers[id].openPopup();
                });
            } else if (lat && lng) {
                // Listing has no marker (no coords) — just show toast
                showToast('📍 This listing has no map pin yet');
            }
        }

        // ── Near Me ────────────────────────────────────────────────────────────
        function zoomToUser() {
            if (!('geolocation' in navigator)) {
                showToast('❌ Geolocation not supported by your browser');
                return;
            }
            const icon = document.getElementById('nearMeIcon');
            icon.style.animation = 'spin 1s linear infinite';
            icon.style.cssText += 'animation: spin 1s linear infinite;';
            const style = document.createElement('style');
            style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
            document.head.appendChild(style);

            showToast('📡 Getting your location...');

            navigator.geolocation.getCurrentPosition(pos => {
                icon.style.animation = '';
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                map.flyTo([userLat, userLng], 13, { animate: true, duration: 1.2 });
                showToast('📍 Showing listings near you!');
            }, err => {
                icon.style.animation = '';
                const msgs = { 1: 'Location permission denied. Enable in browser settings.', 2: 'Location unavailable.', 3: 'Location request timed out.' };
                showToast('❌ ' + (msgs[err.code] || 'Could not get location'));
            }, { timeout: 10000, enableHighAccuracy: true });
        }

        function resetMapView() {
            map.flyTo([22.5, 80.5], 5, { animate: true, duration: 1.2 });
            showToast('🗺️ Showing all of India');
        }

        // ── Sidebar Toggle (Mobile) ────────────────────────────────────────────
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.getElementById('mainLayout').classList.toggle('sidebar-collapsed', !sidebarOpen);
        }

        // ── UI Helpers ─────────────────────────────────────────────────────────
        function showToast(msg, duration = 3000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), duration);
        }

        function showBanner(msg) {
            const b  = document.getElementById('mapBanner');
            const bt = document.getElementById('mapBannerText');
            if (!msg) { b.classList.add('hidden'); return; }
            bt.textContent = msg;
            b.classList.remove('hidden');
            setTimeout(() => b.classList.add('hidden'), 5000);
        }

        function showError(msg) {
            document.getElementById('sidebarListings').innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center p-6 gap-3 opacity-80">
                    <span class="material-symbols-outlined text-5xl text-red-400">wifi_off</span>
                    <p class="font-bold text-gray-700 dark:text-gray-300">${msg}</p>
                    <button onclick="refreshMap()" class="px-4 py-2 bg-primary text-white rounded-full font-bold text-sm">Try Again</button>
                </div>
            `;
            document.getElementById('resultsCount').textContent = 'Error loading';
        }
    </script>
    
<script src="js/zoi-ai-widget.js" defer></script>
</body>
</html>
